name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # 当 main 分支有代码提交时触发（如果是 master 请改为 master）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER__USERNAME }} # 你的 DockerHub 账号
        password: ${{ secrets.DOCKER__PASSWORD }} # 你的 DockerHub 密码（或 Token）

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER__USERNAME }}/libretv-custom:latest # 镜像名称
